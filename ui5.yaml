specVersion: "4.0"
metadata:
  name: workshop.dashboard
type: application
framework:
  name: SAPUI5
  version: "1.148.11"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.layout
    - name: sap.ui.codeeditor
    - name: sap.suite.ui.microchart
    - name: sap.viz
    - name: themelib_sap_horizon
builder:
  # sql.js (SQLite as WebAssembly) is already built: copy it as it is, don't minify or bundle it.
  minification:
    excludes:
      - "workshop/dashboard/thirdparty/**"
  componentPreload:
    excludes:
      - "workshop/dashboard/thirdparty/**"
